# Publish to PyPI on a version tag, using PyPI trusted publishing (no secrets).
#
# Prerequisites, done once on pypi.org: register this repository as a trusted
# publisher for the project "openscad-mcp" with workflow name "publish.yml"
# and environment "pypi". Then `git tag v0.6.1 && git push origin v0.6.1`
# builds, smoke-tests the wheel, uploads it, and creates the GitHub release
# for the tag with the matching CHANGELOG.md section as its notes and the
# sdist and wheel attached.
name: publish

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Check that the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv version --short --color never)"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match pyproject version $version" >&2
            exit 1
          fi
      - name: Build sdist and wheel
        run: uv build
      - name: Smoke-test the built wheel in a clean environment
        run: |
          uv run --isolated --no-project --with dist/*.whl python -c \
            "import openscad_mcp, openscad_mcp.server, openscad_mcp.parts_catalog as p; \
             print(openscad_mcp.__version__, len(p.list_parts()), 'catalog parts')"
          uv run --isolated --no-project --with dist/*.whl openscad-mcp check --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC token for trusted publishing
      contents: read
    steps:
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

  release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and upload its assets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if .github/scripts/release_notes.sh "$version" > notes.md; then
            notes_args="--notes-file notes.md"
          else
            echo "no CHANGELOG.md section for $version; using generated notes" >&2
            notes_args="--generate-notes"
          fi
          # Re-running the workflow must not fail on an existing release.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "v$version" $notes_args --verify-tag --latest
          fi
